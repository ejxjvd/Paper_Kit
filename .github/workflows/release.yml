# Paper_Kit 發布管線（v0.1.1）：測試 → 雙平台打包（PyInstaller → 冒煙 → zip）
# → tag 觸發時附資產到 Release。
#
# 觸發：
#   workflow_dispatch：手動驗證包（出 win/mac 兩包 artifact，不建 Release）
#   push tag v*：測試＋打包＋自動附資產到該 tag 的 Release
#
# 打包細節全在 packaging/build.py（spec 版本由 PK_VERSION/pyproject 帶入）。

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  tests:
    name: tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安裝依賴
        run: uv sync --frozen
      - name: 測試
        run: uv run pytest

  build-win-x64:
    name: build win-x64
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安裝依賴
        run: uv sync --frozen
      - name: 測試
        run: uv run pytest
      - name: 打包（PyInstaller → 冒煙 → zip）
        run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/paper-kit-*-win-x64.zip

  build-macos-arm64:
    name: build macos-arm64
    runs-on: macos-14
    needs: tests
    steps:
      - uses: actions/checkout@v4
      # enable-cache 關閉（2026-08-19 v0.2.0 實測）：setup-uv 的**收尾**快取清理
      # 在 macOS runner 上撞到鎖競爭而失敗——
      #   Cache is currently in-use, waiting for other uv processes to finish
      #   error: Timeout (300s) when waiting for lock on setup-uv-cache
      # 前面的測試、PyInstaller 打包、冒煙、artifact 上傳全部成功，卻因為一個純
      # 清理步驟讓整個 job 標紅 → release job（needs 兩個 build）被跳過 → 明明兩包
      # 都建好了卻沒有 Release。
      # 打包 job 每次都是全新依賴解析，本來就不太受益於 uv 快取；用「少一個會失敗
      # 的環節」換那點時間是划算的。調長 UV_LOCK_TIMEOUT 只是把偶發往後推。
      #
      # ⚠️ 必須顯式寫 false（v0.2.1 實測教訓）：enable-cache 的預設是 `auto`，
      # 在 GitHub 託管 runner 上**自動啟用**。第一次修正只把 `enable-cache: true`
      # 那行刪掉，等於什麼都沒改——v0.2.1 又在同一步失敗一次。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 安裝依賴
        run: uv sync --frozen
      - name: 測試
        run: uv run pytest
      - name: 打包（PyInstaller → 冒煙 → zip）
        run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/paper-kit-*-macos-arm64.zip

  release:
    name: attach assets to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-win-x64, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需要 repo 內的 packaging/RELEASE_NOTES.md 當 notes 來源
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 建立/更新 Release 並附資產
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # notes 從 packaging/RELEASE_NOTES.md 依 tag 提取（各版更新內容，2026-08-14 補全）
          # v0.1.8 bug（2026-08-14 使用者抓到）：regex 原為 "^## " tag "$"（無 v），
          # 但 RELEASE_NOTES.md 標題帶 v 前綴（## v0.1.8）→ 提取 0 行 → fallback
          # 「Paper_Kit 0.1.8」15 字元空 notes。改 "^## v?" tag "$" 同時相容兩式。
          # 常駐包定案（2026-08-14）：提取失敗＝發布流程缺陷——硬失敗（exit 1），
          # 禁止 fallback 靜默出空 notes（v0.1.8 教訓：空 notes 不影響 CI 綠燈）。
          NOTES="$(awk -v tag="${TAG#v}" '
            $0 ~ "^## v?" tag "$" {found=1; print; next}
            found && $0 ~ "^## " {found=0}
            found {print}' packaging/RELEASE_NOTES.md)"
          if [ -z "${NOTES}" ]; then
            echo "::error::Release notes 提取失敗——packaging/RELEASE_NOTES.md 缺 '## v${TAG#v}' 區段（或 awk 契約變更）；先補區段再重跑，禁止空 notes 發布"
            exit 1
          fi
          # -R 明確指定 repo：本 job 無 checkout（只有 download-artifact），
          # gh 靠 git 解析 repo 會報 "not a git repository"（CI 實測 2026-08-14）
          gh release create "${TAG}" artifacts/*.zip \
            --title "Paper_Kit ${TAG#v}" \
            --notes "${NOTES}" \
            -R "${GITHUB_REPOSITORY}" \
          || gh release upload "${TAG}" artifacts/*.zip --clobber -R "${GITHUB_REPOSITORY}"

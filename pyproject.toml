[project]
name = "paper-kit"
version = "0.1.4"
description = "Paper_Kit：自建學術 PDF/簡報翻譯器（免除線上工具綁架）"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
    "pypdf>=5.0",  # 票 06：估算前取 PDF 真實頁數
    "pymupdf>=1.28",  # 票 12：掃描頁 render＋隱形文字層內嵌（OCR 管線）
    "rapidocr_onnxruntime>=1.4",  # 票 12：本機 OCR 引擎（onnxruntime，不上雲）
    "cryptography>=50.0.0",
]

[project.scripts]
paper-kit = "paper_kit.presentation.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-pptx>=1.0.2",
    "pyinstaller>=6.0",  # 打包（packaging/build.py 用）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: 整合冒煙（真實引擎、需要 API key 與 uv tool）——引擎升級時才跑",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_kit"]

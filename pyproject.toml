[project]
name = "paper-kit"
version = "0.1.0"
description = "Paper_Kit：自建學術 PDF/簡報翻譯器（免除線上工具綁架）"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

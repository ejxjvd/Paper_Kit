[project]
name = "paper-kit"
version = "0.1.0"
description = "Paper_Kit：自建學術 PDF/簡報翻譯器（免除線上工具綁架）"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=2.0",
    "pypdf>=5.0",  # 票 06：估算前取 PDF 真實頁數
]

[project.scripts]
paper-kit = "paper_kit.presentation.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: 整合冒煙（真實引擎、需要 API key 與 uv tool）——引擎升級時才跑",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_kit"]
